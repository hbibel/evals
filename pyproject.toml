[project]
name = "evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hannes Bibel" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
evals = "evals:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evals_lib"

[dependency-groups]
search-providers = [
    "polars>=1",
    "pymongo>=4",
]
dev = [
    { include-group = "search-providers" },
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
pythonpath = ["."]
